# Docker Compose — 星幕短剧 Marastel
# 架构: Cloudflare → duanju-nginx (主项目) → marastel-app (本容器)
# 通过共享网络 duanju-api_duanju-net 内部 DNS 解析

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: marastel/app:latest
    container_name: marastel-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - COMPANY_NAME=香港饮冰文化传媒有限公司
      - COMPANY_ADDRESS=RM 1503-09, 15/F, Causeway Bay Centre, 15-23 Sugar St, Causeway Bay, Hong Kong
      - SUPPORT_EMAIL=trendameasor@mail.com
      - SUPPORT_PHONE=+852 6123 4567
      - WEBSITE_URL=https://star.marastel.com
      # 可选：SMTP 邮件通知（留空则仅写文件）
      # - SMTP_HOST=
      # - SMTP_PORT=587
      # - SMTP_USER=
      # - SMTP_PASS=
      # - SMTP_FROM=
      # - CONTACT_NOTIFY_EMAIL=trendameasor@mail.com
    volumes:
      # 只持久化表单数据（contact messages + subscribe），静态 dramas.json 随镜像更新
      - marastel-data:/app/server/data/submissions
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - duanju-api_duanju-net

volumes:
  marastel-data:
    name: marastel-data

networks:
  duanju-api_duanju-net:
    external: true
