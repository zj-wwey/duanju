# ============================================================
# 星幕短剧 Marastel — Nginx 反向代理配置
# 域名：star.marastel.com（KYC 验证站）
# 容器监听：app:3000（Docker Compose 网络内）
# ============================================================

# www 重定向（如果 www.star.marastel.com 解析到服务器）
server {
    listen 80;
    server_name www.star.marastel.com;
    return 301 https://star.marastel.com$request_uri;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name star.marastel.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://star.marastel.com$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    server_name star.marastel.com;

    # SSL 证书（部署后用 certbot 自动生成）
    # certbot --nginx -d star.marastel.com -d www.star.marastel.com
    ssl_certificate     /etc/letsencrypt/live/star.marastel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/star.marastel.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 路由代理到 Express（不缓存）
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由 fallback（让 Express 处理 history mode）
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- DNS 配置指引 ---
# 在 marastel.com 的 DNS 管理后台添加：
#
# 类型    主机记录            值
#  A     star.marastel.com   服务器IP
#  A     www.star.marastel.com 服务器IP（可选，Nginx 自动 301）
#
# 如果用 Cloudflare，开启代理（橙色云）后 certbot 需用 DNS 验证模式：
# certbot certonly --dns-cloudflare --dns-cloudflare-credentials ~/.cf.ini -d star.marastel.com -d www.star.marastel.com
