# 短剧平台 Web 端部署编排
# 用法：
#   1. 复制 .env 内容到项目根 .env 文件并填入实际值
#   2. docker compose up -d
#   3. 申请 SSL 证书后启用 nginx 的 HTTPS 配置
#
# 服务依赖关系：
#   mysql (healthy) ─┐
#   redis (healthy) ┼─→ api (started) ─→ nginx
#   admin-build (completed) ──────────────┘

services:
  # ============ MySQL 8.0 ============
  mysql:
    image: mysql:8.0
    container_name: duanju-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: duanju
      TZ: Asia/Singapore
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - duanju-net

  # ============ Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: duanju-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - duanju-net

  # ============ Web 管理端构建（一次性）============
  # 在容器内执行 npm install + npm run build
  # 产物输出到宿主机 ./admin-dist，供 nginx 托管
  admin-build:
    image: node:20-alpine
    container_name: duanju-admin-build
    working_dir: /app
    command: sh -c "npm install && npm run build"
    volumes:
      - ./front/admin:/app
      - ./admin-dist:/app/dist
    restart: "no"
    networks:
      - duanju-net

  # ============ 后端 API ============
  api:
    build:
      context: ./backed/server
      dockerfile: Dockerfile
    image: duanju-api:latest
    container_name: duanju-api
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内通过服务名访问 mysql/redis
      DB_URL: jdbc:mysql://mysql:3306/duanju?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Singapore
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - duanju-net

  # ============ Nginx 反向代理 ============
  nginx:
    image: nginx:alpine
    container_name: duanju-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./admin-dist:/usr/share/nginx/html/admin:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      admin-build:
        condition: service_completed_successfully
      api:
        condition: service_started
    networks:
      - duanju-net

networks:
  duanju-net:
    driver: bridge
