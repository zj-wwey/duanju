# ============================================================
# 短剧平台 Nginx 配置
# ============================================================

map $http_origin $cors_origin {
    default "";
    "~^https?://(srv|dash|web|cdn)\.marastel\.com$" "$http_origin";
}

upstream backend_api {
    server api:8080;
    keepalive 32;
}

# ---------- API 后端 ----------
server {
    listen 80;
    server_name srv.marastel.com;
    client_max_body_size 1024M;

    location /actuator/health {
        proxy_pass http://backend_api/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ---------- Web 管理端 ----------
server {
    listen 80;
    server_name dash.marastel.com;
    client_max_body_size 1024M;

    root /usr/share/nginx/html/admin;
    index index.html;

    # API 代理
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传文件
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA 路由回退（只在文件不存在时回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- H5 移动端 ----------
server {
    listen 80;
    server_name web.marastel.com;
    location / {
        return 503;
    }
}

# ---------- CDN 静态资源 ----------
server {
    listen 80;
    server_name cdn.marastel.com;

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin $cors_origin;
    }

    location /r2/ {
        rewrite ^/r2/(.*)$ /duanju/$1 break;
        proxy_pass https://038615e6f6f1d9223c6aecc6f7956e68.r2.cloudflarestorage.com;
        proxy_set_header Host 038615e6f6f1d9223c6aecc6f7956e68.r2.cloudflarestorage.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin $cors_origin;
    }

    location / {
        return 404;
    }
}
