# ============================================================
# 短剧平台 Nginx 配置
# ============================================================
# 部署流程：
#   阶段 1（申请证书前）：默认启用「HTTP 模式」，注释掉「HTTPS 模式」
#   阶段 2（证书就绪后）：注释「HTTP 模式」，启用「HTTPS 模式」+ HTTP→HTTPS 跳转
#
# 域名映射（方案 A - 安全子域名）：
#   srv.marastel.com  = API 后端接口
#   dash.marastel.com = Web 管理后台
#   web.marastel.com  = H5 移动端
#   cdn.marastel.com  = 静态资源/CDN
# 重载配置：docker exec duanju-nginx nginx -s reload
# ============================================================

# CORS 白名单：只允许 marastel.com 子域名跨域访问 cdn 资源
# 命中正则的 Origin 透传原值,不命中返回空字符串 (关闭 CORS)
map $http_origin $cors_origin {
    default "";
    "~^https?://(srv|dash|web|cdn)\.marastel\.com$" "$http_origin";
}

upstream backend_api {
    server api:8080;
    keepalive 32;
}

# ============================================================
# 阶段 1：HTTP 模式（申请 SSL 证书前使用）
# 证书就绪后将本段整体注释，启用下方 HTTPS 模式
# ============================================================

# ---------- API 后端 ----------
server {
    listen 80;
    server_name srv.marastel.com;

    client_max_body_size 1024M;

    # 健康检查端点（跳过超时限制，方便负载均衡器探测）
    location /actuator/health {
        proxy_pass http://backend_api/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ---------- Web 管理端 ----------
server {
    listen 80;
    server_name dash.marastel.com;

    client_max_body_size 1024M;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端通过 /api/ 访问后端（与前端 axios baseURL 对应）
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传文件静态访问
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# ---------- H5 移动端（暂时未部署，先返回 503） ----------
server {
    listen 80;
    server_name web.marastel.com;

    location / {
        return 503 "H5 mobile site is under construction.";
    }
}

# ---------- CDN 静态资源 ----------
# 专用于托管用户上传的图片/视频等静态文件 (原 dash.marastel.com 的 /uploads/ 独立出来)
# 好处:静态资源不占用 API 后端带宽,可独立配置缓存策略、独立扩容、未来接 Cloudflare R2 时只需改这里
server {
    listen 80;
    server_name cdn.marastel.com;

    # 上传文件静态访问 (头像/封面/本地视频) - 本地存储模式
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 跨域白名单 (见文件顶部 map 定义),只允许 marastel.com 子域
        add_header Access-Control-Allow-Origin $cors_origin;
    }

    # R2 已绑定自定义域名 r2.marastel.com,无需 Nginx 代理
    # 旧 URL /r2/xxx 重定向到 r2.marastel.com/xxx
    location /r2/ {
        rewrite ^/r2/(.*)$ https://r2.marastel.com/$1 permanent;
    }

    # 其他路径返回 404
    location / {
        return 404;
    }
}

