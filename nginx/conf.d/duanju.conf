# ============================================================
# 短剧平台 Nginx 配置
# ============================================================
# 部署流程：
#   阶段 1（申请证书前）：默认启用「HTTP 模式」，注释掉「HTTPS 模式」
#   阶段 2（证书就绪后）：注释「HTTP 模式」，启用「HTTPS 模式」+ HTTP→HTTPS 跳转
#
# 修改域名：全局替换 yourdomain.com 为你的实际域名
# 重载配置：docker exec duanju-nginx nginx -s reload
# ============================================================

upstream backend_api {
    server api:8080;
    keepalive 32;
}

# ============================================================
# 阶段 1：HTTP 模式（申请 SSL 证书前使用）
# 证书就绪后将本段整体注释，启用下方 HTTPS 模式
# ============================================================

# ---------- API 后端 ----------
server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 1024M;

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# ---------- Web 管理端 ----------
server {
    listen 80;
    server_name admin.yourdomain.com;

    client_max_body_size 1024M;

    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理端通过 /api/ 访问后端（与前端 axios baseURL 对应）
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件静态访问
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# ---------- H5 移动端（暂时未部署，先返回 503） ----------
server {
    listen 80;
    server_name m.yourdomain.com;

    location / {
        return 503 "H5 mobile site is under construction.";
    }
}

# ============================================================
# 阶段 2：HTTPS 模式（SSL 证书就绪后启用）
# 启用步骤：
#   1. 注释上方「HTTP 模式」所有 server 块
#   2. 取消下方所有 server 块的注释
#   3. 把证书放入 ./nginx/ssl/（fullchain.pem + privkey.pem）
#   4. docker exec duanju-nginx nginx -s reload
# ============================================================

