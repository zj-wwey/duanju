# ============================================================
# 阶段 2：HTTPS 模式（SSL 证书就绪后启用）
# 启用步骤：
#   1. 注释上方「HTTP 模式」所有 server 块
#   2. 取消下方所有 server 块的注释
#   3. 把证书放入 ./nginx/ssl/（fullchain.pem + privkey.pem）
#   4. docker exec duanju-nginx nginx -s reload
# ============================================================

# HTTP → HTTPS 跳转
server {
    listen 80 default_server;
    server_name srv.marastel.com dash.marastel.com web.marastel.com cdn.marastel.com;
    return 301 https://$host$request_uri;
}
#
# ---------- API 后端 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name srv.marastel.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1024M;

    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
#
# ---------- Web 管理端 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name dash.marastel.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 1024M;

    root /usr/share/nginx/html/admin;
    index index.html;

    # ============================================================
    # 3 层 API 兜底（解决前端构建 VITE_API_BASE_URL 漏注入导致的路径畸形问题）
    #   第 1 层（最优先）: /api/* 正常前缀，反代到后端 /api/* （nginx 已存在的 location /api/）
    #   第 2 层: 无 /api 前缀、但路径格式正确的 API 请求（/admin/auth/login、/auth/captcha 等）
    #           → 自动在前面补 /api 前缀反代
    #   第 3 层: 无斜杠的畸形拼写（/authLogin、/adminAuthLogin）→ rewrite 成正确路径再走第 2 层
    # ============================================================

    # ---- 第 3 层（畸形路径 rewrite，先于 location 命中执行） ----
    rewrite ^/authLogin$           /admin/auth/login   last;
    rewrite ^/adminAuthLogin$      /admin/auth/login   last;
    rewrite ^/authRegister$        /auth/register      last;
    rewrite ^/authCaptcha$         /auth/captcha       last;
    rewrite ^/adminAuthMe$         /admin/auth/me      last;
    rewrite ^/userMe$              /user/me            last;

    # ---- 第 1 层（已有 /api 前缀的正常请求） ----
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 第 2 层（无前缀 /api 的正确 API 路径：/admin/*、/auth/*、/user/*、/category-filters、/dramas、/orders/* 等）----
    #  优先级必须比 location / {try_files} 高，所以用前缀列表写死
    location ~ ^/(admin|auth|user|category-filters|dramas|orders|episodes|favorites|history|checkin|settings|points|unlock|uploads/captcha|config|public-stats|stats|search|admin-auth|upload|batch-upload|webhooks|storage|payments|stripe|paypal|apple|google|ad|ads|cloudflare|drama|videos|video|import|export|reports|report|log|logs|audit|menu|permission|role|roles|member|members|user-profile|dict|dicts|oss|r2|captcha|refresh)($|/|\?) {
        rewrite ^(.*)$ /api$1 break;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 兜底: SPA 路由回落到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
#
# ---------- H5 移动端 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name web.marastel.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html/h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
#
# ---------- CDN 静态资源 ----------
# 与 HTTP 阶段的 cdn server 块对应,证书就绪后启用
server {
    listen 443 ssl;
    http2 on;
    server_name cdn.marastel.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin $cors_origin;
    }

    # R2 对象存储反代 (HTTP 阶段已启用,HTTPS 同步配置)
    location /r2/ {
        rewrite ^/r2/(.*)$ /duanju/$1 break;
        proxy_pass https://038615e6f6f1d9223c6aecc6f7956e68.r2.cloudflarestorage.com;
        proxy_set_header Host 038615e6f6f1d9223c6aecc6f7956e68.r2.cloudflarestorage.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin $cors_origin;
    }

    location / {
        return 404;
    }
}
